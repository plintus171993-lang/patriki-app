<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Патрики Офис</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../vendor/supabase.js"></script>
<style>
:root{
  --side:#1d2633; --side2:#273244; --sideText:#c4cdd9; --accent:#2f7de1; --accentSoft:#e8f1fc;
  --bg:#f3f5f8; --card:#fff; --line:#e3e7ed; --text:#1d2633; --muted:#6b7686;
  --in:#1f9d55; --inSoft:#e6f6ec; --out:#d64545; --outSoft:#fdecec; --warn:#d98b1c; --warnSoft:#fdf3e3;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--side)}
.loginBox{background:#fff;border-radius:10px;padding:32px;width:340px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.loginBox h1{margin:0 0 4px;font-size:20px}.loginBox p{margin:0 0 20px;color:var(--muted)}
/* layout */
#app{display:flex;min-height:100vh}
aside{width:220px;background:var(--side);color:var(--sideText);flex-shrink:0;display:flex;flex-direction:column}
.brand{padding:18px 20px;font-weight:700;color:#fff;font-size:16px;letter-spacing:.2px;border-bottom:1px solid var(--side2)}
.brand small{display:block;font-weight:400;color:var(--sideText);font-size:12px}
nav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--sideText);text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:var(--side2);color:#fff}
nav a.on{background:var(--side2);color:#fff;border-left-color:var(--accent)}
nav svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.who{margin-top:auto;padding:14px 20px;border-top:1px solid var(--side2);font-size:12px}
.who a{color:#8fb7ef;cursor:pointer}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px}
.top h2{margin:0;font-size:17px;font-weight:600;flex:1}
.content{padding:20px 24px;overflow:auto}
/* controls */
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{border-color:#c5ccd6}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#246bc6}
.btn.green{background:var(--in);border-color:var(--in);color:#fff}
.btn.red{background:var(--out);border-color:var(--out);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;color:var(--text);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accentSoft);border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-bottom:12px}
label.f input,label.f select,label.f textarea{font-size:14px;color:var(--text)}
/* cards */
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.cb{cursor:pointer;transition:border-color .15s}.cb:hover,.cb.sel{border-color:var(--accent)}
.cb .v.neg{color:var(--out)}
h3{font-size:14px;margin:0 0 12px;font-weight:600}
/* tables */
.tw{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto}
table{border-collapse:collapse;width:100%}
th{background:#f7f8fa;text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:8px 12px;border-bottom:1px solid #eef1f4;vertical-align:top}
tr:hover td{background:#fafbfd}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--in)}.out{color:var(--out)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#eef1f4;color:var(--muted);white-space:nowrap}
.pill.g{background:var(--inSoft);color:var(--in)}.pill.r{background:var(--outSoft);color:var(--out)}.pill.y{background:var(--warnSoft);color:var(--warn)}.pill.b{background:var(--accentSoft);color:var(--accent)}
.muted{color:var(--muted)}
.tot td{font-weight:600;background:#f7f8fa}
/* timesheet */
.ts td,.ts th{padding:4px 0;text-align:center;min-width:30px;font-size:12px;border-right:1px solid #eef1f4}
.ts td.nm,.ts th.nm{text-align:left;padding:4px 10px;min-width:170px;position:sticky;left:0;background:#fff;z-index:2}
.ts th.nm{background:#f7f8fa;z-index:3}
.ts td.c{cursor:pointer}
.ts td.c:hover{background:var(--accentSoft)}
.ts td.on{background:#e9f5ee;color:#15693b;font-weight:600}
.ts td.other{background:#fdf6e9;color:var(--warn);font-size:10px}
.ts th.we{color:var(--out)}
.ts tr.grp td{background:#f2f4f7;font-weight:600;text-align:left;padding:5px 10px;font-size:12px;color:var(--muted);position:static}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs a{padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,28,40,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:50}
.mb.wide{width:620px}.mb.xwide{width:1180px}.mb{background:#fff;border-radius:10px;width:440px;max-width:94vw;max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;display:flex}
.mh span{flex:1}.mh a{cursor:pointer;color:var(--muted)}
.mc{padding:18px 20px}
.mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2>*{min-width:0}label.f input,label.f select{width:100%}
#toast{position:fixed;bottom:20px;right:20px;background:var(--side);color:#fff;padding:10px 16px;border-radius:6px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.err{color:var(--out);font-size:13px;margin-top:8px}
.chart{width:100%;height:220px}
.hbar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.hbar .t{width:170px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{flex:1;height:10px;background:#eef1f4;border-radius:5px;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar .n{width:110px;text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:820px){aside{width:64px}.brand small,nav a span,.who{display:none}.brand{font-size:12px;padding:16px 8px;text-align:center}nav a{justify-content:center;padding:12px 0}.content{padding:14px}}
</style>
</head>
<body>

<div id="login">
  <form class="loginBox" id="loginForm">
    <h1>Патрики Офис</h1>
    <p>Вход для владельца и управляющих</p>
    <label class="f">Email<input id="lEmail" type="email" required autocomplete="username"></label>
    <label class="f">Пароль<input id="lPass" type="password" required autocomplete="current-password"></label>
    <button class="btn pri" style="width:100%">Войти</button>
    <div class="err" id="lErr"></div>
  </form>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brand">ПАТРИКИ<small>Офис · учёт заведений</small></div>
    <nav id="nav"></nav>
    <div class="who"><div id="whoName"></div><a id="logout">Выйти</a></div>
  </aside>
  <main>
    <div class="top">
      <h2 id="title"></h2>
      <select id="venueSel"></select>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<div id="modal" class="hidden"><div class="mb"><div class="mh"><span id="mTitle"></span><a id="mX">✕</a></div><div class="mc" id="mBody"></div><div class="mf" id="mFoot"></div></div></div>
<div id="toast" class="hidden"></div>

<script>
const SB_URL='https://ozbdmczmpejyctezxrdk.supabase.co';
const SB_KEY='sb_publishable_PhI0d9qM0Hp7KrERGKHQfg_668fWJMv';
const sb=supabase.createClient(SB_URL,SB_KEY);

const S={me:null,venues:[],venue:'all',cashboxes:[],employees:[],page:'dash',month:new Date().toISOString().slice(0,7),cbSel:null,cache:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub=n=>(n==null||isNaN(n))?'—':Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ')+' ₽';
const num=n=>(n==null||n==='')?'':(+n).toLocaleString('ru-RU',{maximumFractionDigits:2});
const fd=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'}):'';
const monthName=m=>new Date(m+'-15').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
const daysIn=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const monthEnd=m=>m+'-'+String(daysIn(m)).padStart(2,'0');
const today=()=>new Date(Date.now()+3*3600e3).toISOString().slice(0,10);
const DEPT={bar:'Бар',hall:'Зал',kitchen:'Кухня',dish:'Мойка',admin:'Администрация'};
const KIND={accountable:'Подотчёт',cash:'Наличные',bank:'Безнал / р/с',safe:'Сейф',other:'Другое'};
const CATS_OUT=['Зарплата и авансы','Поставщики','Аренда','Коммунальные услуги','Комиссия банка','Продукты и напитки','Хозтовары и магазин','Ремонт и обслуживание','Маркетинг и печать','Игровые автоматы','Вывоз, уборка, охрана','Налоги, юристы, штрафы','Связь и IT','Транспорт и доставка','Финансы','Прочее'];
const CATS_IN=['Выручка','Эквайринг','Яндекс Доставка','Поступление на счёт','Взносы учредителей и займы','Возврат с зарплаты','Итоги инвентаризации','Прочие приходы'];

function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hidden'),2600)}
function modal(title,body,foot,wide){document.querySelector('.mb').classList.toggle('wide',!!wide);document.querySelector('.mb').classList.remove('xwide');$('#mTitle').textContent=title;$('#mBody').innerHTML=body;$('#mFoot').innerHTML='';(foot||[]).forEach(b=>$('#mFoot').appendChild(b));$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
$('#mX').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function btn(t,cls,fn){const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=t;b.onclick=fn;return b}
async function q(p){const {data,error}=await p;if(error){toast('Ошибка: '+error.message);throw error}return data}
async function all(build){let out=[],from=0;for(;;){const d=await q(build().range(from,from+999));out=out.concat(d);if(d.length<1000)break;from+=1000}return out}
const venueName=id=>id?((S.venues.find(v=>v.id===id)||{}).name||id):'Вся компания';
const vFilter=(qb,col='venue_id')=>S.venue==='all'?qb:qb.eq(col,S.venue);

/* ---------- auth ---------- */
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#lErr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lPass').value});
  if(error){$('#lErr').textContent='Не удалось войти: '+(error.message==='Invalid login credentials'?'неверный email или пароль':error.message);return}
  start()};
$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const me=await q(sb.rpc('crm_me'));
  if(!me.owner&&!me.venues.length){$('#lErr').textContent='У этой учётной записи нет доступа к CRM';await sb.auth.signOut();return}
  S.me=me;
  S.venues=await q(sb.from('venues').select('id,name').order('sort'));
  if(!me.owner){S.venues=S.venues.filter(v=>me.venues.includes(v.id)||me.venues.includes(null))}
  $('#venueSel').innerHTML=(me.owner||S.venues.length>1?'<option value="all">Все заведения</option>':'')+S.venues.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('');
  S.venue=$('#venueSel').value;
  $('#venueSel').onchange=()=>{S.venue=$('#venueSel').value;render()};
  $('#whoName').textContent=(me.name||'')+(me.owner?' · владелец':' · управляющий');
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  await loadRefs();buildNav();
  const h=location.hash.slice(1);if(pageOk(h))S.page=h;
  render();
}
async function loadRefs(){
  S.cashboxes=await q(sb.from('crm_cashbox_balances').select('*').order('sort'));
  S.employees=await q(sb.from('crm_employees').select('*').order('name'));
}

/* ---------- nav ---------- */
const IC={
 dash:'<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>',
 cash:'<path d="M2 6h20v12H2zM6 12a6 6 0 0 0 0 0M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z" fill="none" stroke="currentColor" stroke-width="2"/>',
 ts:'<path d="M4 5h16v15H4zM4 9h16M9 3v4M15 3v4" fill="none" stroke="currentColor" stroke-width="2"/>',
 staff:'<path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 9a7 7 0 0 1 14 0zm15-9a3 3 0 1 0 0-6M22 20a5 5 0 0 0-4-5" fill="none" stroke="currentColor" stroke-width="2"/>',
 pay:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" fill="none" stroke="currentColor" stroke-width="2"/>',
 mot:'<path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z" fill="none" stroke="currentColor" stroke-width="2"/>',
 log:'<path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5" fill="none" stroke="currentColor" stroke-width="2"/>',
 acc:'<path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6zM9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2"/>',
 loy:'<path d="M3 7h18v12H3zM3 11h18M7 15h4" fill="none" stroke="currentColor" stroke-width="2"/>',
 cost:'<path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h3M14 15h2" fill="none" stroke="currentColor" stroke-width="2"/>'
};
const PAGES=[
 {id:'dash',t:'Сводка',ic:'dash',perm:'revenue.view'},{id:'cash',t:'Кассы и деньги',ic:'cash',perm:'cash.view'},{id:'ts',t:'Табель',ic:'ts'},
 {id:'staff',t:'Сотрудники',ic:'staff',perm:'staff.edit'},{id:'cost',t:'Себестоимость',ic:'cost',perm:'cost.view'},{id:'pay',t:'Зарплата',ic:'pay',owner:1},{id:'loy',t:'Система лояльности',ic:'loy',owner:1},{id:'mot',t:'Мотивация',ic:'mot',owner:1},{id:'acc',t:'Доступы',ic:'acc',owner:1},{id:'log',t:'Журнал действий',ic:'log',owner:1}];
const can=p=>S.me.owner||S.me.perms.includes(p);
const pageOk=id=>{const p=PAGES.find(x=>x.id===id);return !!p&&(S.me.owner||(!p.owner&&(!p.perm||can(p.perm))))};
function buildNav(){
  if(!pageOk(S.page))S.page=PAGES.find(p=>pageOk(p.id)).id;
  $('#nav').innerHTML=PAGES.filter(p=>pageOk(p.id)).map(p=>`<a data-p="${p.id}"><svg viewBox="0 0 24 24" fill="currentColor">${IC[p.ic]}</svg><span>${p.t}</span></a>`).join('');
  $('#nav').querySelectorAll('a').forEach(a=>a.onclick=()=>{S.page=a.dataset.p;location.hash=S.page;render()});
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==S.page&&pageOk(h)){S.page=h;render()}});
function render(){
  closeModal();
  $('#nav').querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.p===S.page));
  const p=PAGES.find(p=>p.id===S.page);$('#title').textContent=p.t;
  $('#view').innerHTML='<div class="empty">Загрузка…</div>';
  ({dash:vDash,cash:vCash,ts:vTs,staff:vStaff,cost:vCost,pay:vPay,loy:vLoy,mot:vMot,log:vLog,acc:vAcc})[S.page]().catch(e=>{console.error(e);$('#view').innerHTML='<div class="empty">Не удалось загрузить данные</div>'});
}
function monthPicker(id){return `<input type="month" id="${id}" value="${S.month}">`}
function bindMonth(id){$('#'+id).onchange=e=>{S.month=e.target.value;render()}}

/* ---------- Сводка ---------- */
async function vDash(){
  const m=S.month,from=m+'-01',to=monthEnd(m);
  const rev=await q(vFilter(sb.from('crm_daily_revenue').select('*')).gte('day',from).lte('day',to).order('day'));
  const cbIds=S.cashboxes.filter(c=>S.venue==='all'||c.venue_id===S.venue||!c.venue_id).map(c=>c.id);
  const ops=cbIds.length?await all(()=>sb.from('crm_cash_ops').select('amount,direction,category,transfer_id').in('cashbox_id',cbIds).gte('op_date',from).lte('op_date',to)):[];
  const pay=S.me.owner?await q(vFilter(sb.from('crm_payroll').select('total')).eq('month',from)):[];
  const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
  const cashless=sum(rev,r=>r.cashless),cash=sum(rev,r=>r.cash),total=cashless+cash;
  const exp=ops.filter(o=>o.direction==='out'&&!o.transfer_id&&!['Корректировка остатка','Перемещение'].includes(o.category));
  const expSum=sum(exp,o=>o.amount),fot=sum(pay,p=>p.total);
  const byCat={};exp.forEach(o=>byCat[o.category||'Прочее']=(byCat[o.category||'Прочее']||0)+ +o.amount);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const maxC=cats.length?cats[0][1]:1;
  const kitchen=sum(rev,r=>r.kitchen_turnover),bar=sum(rev,r=>r.bar_turnover),fee=sum(rev,r=>r.service_fee);
  $('#view').innerHTML=`
  <div class="bar">${monthPicker('dm')}<span class="muted">${monthName(m)}</span><span class="sp"></span>${S.me.owner?'<button class="btn pri" id="bIiko">⟳ Выручка из iiko</button>':''}</div>
  <div class="grid k4">
    ${kpi('Выручка',rub(total),rev.length?`${rev.length} дн. · в среднем ${rub(total/rev.length)}`:'нет данных')}
    ${kpi('Безнал',rub(cashless),total?Math.round(cashless/total*100)+'% выручки':'')}
    ${kpi('Наличные по кассе',rub(cash),total?Math.round(cash/total*100)+'% выручки':'')}
    ${kpi('Кухня / бар',rub(kitchen)+'<br><span style="font-size:16px">'+rub(bar)+'</span>','оборот по iiko')}
    ${can('cash.view')?kpi('Расходы из касс',rub(expSum),exp.length+' операций'):''}
    ${S.me.owner?kpi('Фонд оплаты труда',rub(fot),pay.length?pay.length+' в ведомости':'ведомость не закрыта'):''}
  </div>
  <div class="grid" style="grid-template-columns:${can('cash.view')?'2fr 1fr':'1fr'};margin-top:14px">
    <div class="card"><h3>Выручка по дням</h3>${revChart(rev,m)}<div class="muted" style="font-size:12px;margin-top:6px"><span style="color:var(--accent)">■</span> безнал &nbsp; <span style="color:#7fb3f0">■</span> наличные по кассе${fee?` &nbsp;·&nbsp; сервисный сбор за месяц: ${rub(fee)}`:''}</div></div>

const kpi=(l,v,s)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`;
function cbCards(){const list=S.cashboxes.filter(c=>S.venue==='all'||c.venue_id===S.venue||!c.venue_id);
  return list.length?list.map(c=>`<div class="card kpi cb ${S.cbSel===c.id?'sel':''}" data-id="${c.id}"><div class="l">${esc(KIND[c.kind]||c.kind)} · ${esc(venueName(c.venue_id))}</div><div class="v ${c.balance<0?'neg':''}">${rub(c.balance)}</div><div class="s">${esc(c.name)}${c.iiko_pay_type?' · <span class="pill b">iiko</span>':''}${c.last_op?' · посл. операция '+fd(c.last_op):''}</div></div>`).join(''):'<div class="empty">Касс нет</div>'}
function revChart(rev,m){
  const n=daysIn(m),by={};rev.forEach(r=>{const d=+r.day.slice(8);by[d]=by[d]||{a:0,b:0};by[d].a+=+r.cashless||0;by[d].b+=+r.cash||0});
  const max=Math.max(1,...Object.values(by).map(x=>x.a+x.b));const W=700,H=200,bw=W/n;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H+20}" preserveAspectRatio="none">`;
  for(let g=1;g<=3;g++){const y=H-H*g/4;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#eef1f4"/><text x="2" y="${y-3}" font-size="10" fill="#9aa4b2">${Math.round(max*g/4/1000)}k</text>`}
  for(let d=1;d<=n;d++){const x=(d-1)*bw+bw*.15,w=bw*.7,v=by[d]||{a:0,b:0};const ha=v.a/max*H,hb=v.b/max*H;
    const wd=new Date(m+'-'+String(d).padStart(2,'0')+'T12:00:00').getDay();
    s+=`<g><title>${d}.${m.slice(5)}: ${rub(v.a+v.b)}</title><rect x="${x}" y="${H-ha}" width="${w}" height="${ha}" fill="#2f7de1" rx="1"/><rect x="${x}" y="${H-ha-hb}" width="${w}" height="${hb}" fill="#7fb3f0" rx="1"/></g>`;
    if(n<=31)s+=`<text x="${x+w/2}" y="${H+14}" font-size="9" text-anchor="middle" fill="${wd===0||wd===6?'#d64545':'#9aa4b2'}">${d}</text>`}
  return s+'</svg>'}

/* ---------- Банковская выписка (формат 1С) ---------- */
function bankPick(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.txt,.1c,text/plain';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    const buf=await f.arrayBuffer();let txt=new TextDecoder('utf-8').decode(buf);
    if(!/1CClientBankExchange/.test(txt)||/Кодировка=Windows/i.test(txt)||txt.includes('�'))txt=new TextDecoder('windows-1251').decode(buf);
    try{bankPreview(parse1C(txt),f.name)}catch(e){toast(e.message)}};
  inp.click();
}
function parse1C(txt){
  if(!/1CClientBankExchange/.test(txt))throw new Error('Это не выписка в формате 1С (нет заголовка 1CClientBankExchange)');
  const lines=txt.split(/\r?\n/);const head={},docs=[];let cur=null,accs=[];
  for(const l of lines){const i=l.indexOf('=');const k=i>0?l.slice(0,i).trim():l.trim(),v=i>0?l.slice(i+1).trim():'';
    if(k.startsWith('СекцияДокумент')){cur={_type:v};continue}
    if(k==='КонецДокумента'){if(cur)docs.push(cur);cur=null;continue}
    if(cur){cur[k]=v}else{if(k==='РасчСчет'&&v)accs.push(v);head[k]=v}}
  const cnt={};docs.forEach(d=>[d.ПлательщикСчет,d.ПолучательСчет].forEach(a=>{if(accs.includes(a))cnt[a]=(cnt[a]||0)+1}));
  const acc=accs.length===1?accs[0]:Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0];
  if(!acc)throw new Error('Не нашёл номер расчётного счёта в выписке');
  const dt=s=>s&&/^\d\d\.\d\d\.\d{4}$/.test(s)?s.slice(6)+'-'+s.slice(3,5)+'-'+s.slice(0,2):null;
  const clean=s=>(s||'').replace(/^ИНН\s*\d+\s*/,'').trim();
  const ops=docs.filter(d=>d.ПлательщикСчет===acc||d.ПолучательСчет===acc).map(d=>{
    const out=d.ПлательщикСчет===acc;
    const cp=out?clean(d.Получатель1||d.Получатель):clean(d.Плательщик1||d.Плательщик),inn=out?d.ПолучательИНН:d.ПлательщикИНН;
    return {ext:[d.Номер,d.Дата,d.Сумма,d.ПлательщикСчет,d.ПолучательСчет].join('|'),date:dt(out?d.ДатаСписано:d.ДатаПоступило)||dt(d.Дата),
      dir:out?'out':'in',amount:+String(d.Сумма||'0').replace(',','.'),cp,inn:inn||null,purpose:d.НазначениеПлатежа||'',num:d.Номер}}).filter(o=>o.amount>0&&o.date);
  return {acc,bank:head.Отправитель||'',from:dt(head.ДатаНачала),to:dt(head.ДатаКонца),ops};
}
function autoCat(o,rules){
  const r=rules.find(r=>r.direction===o.dir&&((o.inn&&r.inn===o.inn)||(!r.inn&&r.name&&r.name===o.cp)));if(r)return r.category;
  const t=(o.cp+' '+o.purpose).toLowerCase();

const PAYK2={advance:'аванс',salary:'зарплата',bonus:'премия',vacation:'отпускные'};

function findEmpByFio(fio){const f=normFio(fio);if(!f)return null;const w=f.split(' ');
  let m=S.employees.filter(e=>e.full_name&&normFio(e.full_name)===f);if(m.length===1)return m[0];
  m=S.employees.filter(e=>e.full_name&&normFio(e.full_name).split(' ').slice(0,2).join(' ')===w.slice(0,2).join(' '));if(m.length===1)return m[0];

const monthOf=(d,shift)=>{const x=new Date(d.slice(0,7)+'-15T12:00:00');x.setMonth(x.getMonth()+(shift||0));return x.toISOString().slice(0,7)};
const MONTHS_RU=['январ','феврал','март','апрел','ма','июн','июл','август','сентябр','октябр','ноябр','декабр'];
function guessSalary(o){
  const t=o.purpose.toLowerCase();
  const kind=/отпуск/.test(t)?'vacation':/аванс/.test(t)?'advance':/преми/.test(t)?'bonus':'salary';
  let month=null;const mm=t.match(/за\s+(январ|феврал|март|апрел|ма[йя]|июн|июл|август|сентябр|октябр|ноябр|декабр)\S*\s+(\d{4})/);
  if(mm){const i=MONTHS_RU.findIndex(x=>mm[1].startsWith(x));month=mm[2]+'-'+String(i+1).padStart(2,'0')}
  if(!month)month=kind==='advance'||+o.date.slice(8)>15?o.date.slice(0,7):monthOf(o.date,-1);
  const reg=(o.purpose.match(/реестр\S*\s*№\s*(\d+)/i)||[])[1]||null;

function classify(o){

  if(o.dir==='out'&&/заработн|зарплат|аванс|отпускн|оплат[аы] труда/.test(o.purpose.toLowerCase())&&!/ндфл|налог|взнос/.test(t)){
    const g=guessSalary(o);if(g.reg||/сбербанк/i.test(o.cp)&&/реестр/i.test(o.purpose))return {type:'salreg',...g};

  const dayHdr=[...Array(n)].map((_,i)=>{const wd=new Date(m+'-'+String(i+1).padStart(2,'0')+'T12:00:00').getDay();return `<th class="${wd===0||wd===6?'we':''}">${i+1}</th>`}).join('');

function motShort(m){const p=[];p.push(m.pay_type==='monthly'?'оклад '+rub(m.rate):num(m.rate)+' '+PAYT[m.pay_type]);
  if(m.revenue_bonus)p.push('премия за выручку');if(m.service_fee)p.push('сервисный сбор');
  if(m.kitchen_pct)p.push(num(m.kitchen_pct)+'% кухни сверх '+rub(m.kitchen_threshold));

  if(m.fixed_bonus)p.push('+'+rub(m.fixed_bonus)+'/мес');return p.join(' · ')}

/* ---------- Зарплата ---------- */
const PAYK={advance:'Аванс',salary:'Зарплата',bonus:'Премия',vacation:'Отпускные'};
function dayGroup(d){const w=new Date(d+'T12:00:00').getDay();return w===4?'thu':(w===5||w===6)?'fri_sat':'sun_wed'}
function ruleOn(rules,kind,day){return rules.filter(r=>r.kind===kind&&r.active&&r.valid_from<=day&&(!r.valid_to||r.valid_to>=day)).sort((a,b)=>b.valid_from.localeCompare(a.valid_from))[0]}
async function calcPayroll(m,venue){
  const from=m+'-01',to=monthEnd(m);
  const [shifts,rev,rules,mots,pays]=await Promise.all([
    all(()=>sb.from('crm_shifts').select('employee_id,venue_id,day,hours,amount').eq('venue_id',venue).gte('day',from).lte('day',to)),
    q(sb.from('crm_daily_revenue').select('*').eq('venue_id',venue).gte('day',from).lte('day',to)),
    q(sb.from('crm_motivation_rules').select('*').or(`venue_id.eq.${venue},venue_id.is.null`)),
    q(sb.from('crm_employee_motivation').select('*').lte('valid_from',to).order('valid_from',{ascending:false})),
    all(()=>sb.from('crm_cash_ops').select('id,cashbox_id,op_date,amount,comment,employee_id,pay_kind').eq('pay_month',from).not('employee_id','is',null)),
    all(()=>sb.from('crm_salary_alloc').select('id,op_id,employee_id,amount,pay_kind,source,crm_cash_ops(op_date,cashbox_id,registry_no)').eq('pay_month',from))]).then(r=>{
      r[4]=r[4].concat(r[5].map(a=>({id:a.id,alloc:true,cashbox_id:a.crm_cash_ops?.cashbox_id,op_date:a.crm_cash_ops?.op_date,amount:a.amount,employee_id:a.employee_id,pay_kind:a.pay_kind,reg:a.crm_cash_ops?.registry_no})));return r.slice(0,5)});
  const motOf={};mots.forEach(x=>{if(!motOf[x.employee_id])motOf[x.employee_id]=x});
  const revDay={};rev.forEach(r=>revDay[r.day]=r);
  const byEmp={};const E=id=>byEmp[id]=byEmp[id]||{shifts:0,hours:0,amount:0,base:0,revBonus:0,service:0,pct:0,fixed:0,days:[]};
  shifts.forEach(s=>{const x=E(s.employee_id);x.shifts++;x.hours+=+s.hours||0;x.amount+=+s.amount||0;x.days.push(s.day)});
  // ежедневные премии: делятся поровну между теми, у кого в мотивации стоит галочка и кто был на смене
  const onShift={};shifts.forEach(s=>(onShift[s.day]=onShift[s.day]||[]).push(s.employee_id));
  for(const [day,ids] of Object.entries(onShift)){
    const r=revDay[day];if(!r)continue;
    const rb=ids.filter(id=>motOf[id]?.revenue_bonus),sf=ids.filter(id=>motOf[id]?.service_fee);
    const tr=ruleOn(rules,'revenue_tiers',day);
    if(tr&&rb.length){const t=(tr.params.tiers||{})[dayGroup(day)]||[];let bonus=0;t.forEach(([th,b])=>{if(+r.total>=th)bonus=b});if(bonus)rb.forEach(id=>E(id).revBonus+=bonus/rb.length)}
    const sr=ruleOn(rules,'service_fee',day);
    if(+r.service_fee&&sf.length){const k=1-((sr?.params?.withhold_pct)||0)/100;sf.forEach(id=>E(id).service+=r.service_fee*k/sf.length)}
  }
  const sumRev=f=>rev.reduce((s,r)=>s+(+r[f]||0),0);
  const monthRev={total:sumRev('total'),bar:sumRev('bar_turnover'),kitchen:sumRev('kitchen_turnover')};
  const out=[];
  for(const e of S.employees){
    const mo=motOf[e.id],x=byEmp[e.id];const paid=pays.filter(p=>p.employee_id===e.id);
    if(!x&&!paid.length&&mo?.pay_type!=='monthly')continue;
    if(!e.active&&!x&&!paid.length)continue;
    if(e.home_venue!==venue&&!x&&!paid.length)continue;
    const y=x||E(e.id);
    if(mo){
      if(mo.pay_type==='hourly')y.base=y.hours*mo.rate;
      else if(mo.pay_type==='per_shift')y.base=y.amount||y.shifts*mo.rate;
      else y.base=+mo.rate;
      if(mo.kitchen_pct)y.pct+=Math.max(0,monthRev.kitchen-(+mo.kitchen_threshold||0))*mo.kitchen_pct/100;
      if(mo.revenue_pct)y.pct+=(monthRev[mo.revenue_base||'total']||0)*mo.revenue_pct/100;
      y.fixed=+mo.fixed_bonus||0;
    }
    const accrued=y.base+y.revBonus+y.service+y.pct+y.fixed,paidSum=paid.reduce((s,p)=>s+ +p.amount,0);
    out.push({e,mo,...y,accrued,paid,paidSum,debt:accrued-paidSum});
  }
  const ord=['bar','hall','kitchen','dish','admin'];
  out.sort((a,b)=>ord.indexOf(a.e.dept)-ord.indexOf(b.e.dept)||a.e.name.localeCompare(b.e.name));
  return {rows:out,monthRev,noRev:!rev.length};
}

/* ---------- Загрузка реестра зарплатного проекта (Excel / CSV / XML) ---------- */
function regPick(unal){
  const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv,.xml,.txt';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{regMatch(await parseRegistry(f),unal,f.name)}catch(e){toast('Не получилось прочитать реестр: '+e.message)}};inp.click();
}
async function loadXLSX(){if(window.XLSX)return;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('не загрузилась библиотека Excel'));document.head.appendChild(s)})}
const isFio=s=>/^[А-ЯЁ][а-яё-]+\s+[А-ЯЁ][а-яё-]+(\s+[А-ЯЁ][а-яё-]+){0,2}$/.test(String(s||'').trim());
const toNum=v=>typeof v==='number'?v:+String(v||'').replace(/\s/g,'').replace(',','.');
async function parseRegistry(f){
  const buf=await f.arrayBuffer();let rows=[],text='';
  if(/\.xml$/i.test(f.name)||/^\s*</.test(new TextDecoder().decode(buf.slice(0,200)))){
    let t=new TextDecoder('utf-8').decode(buf);if(t.includes('�')||/windows-1251/i.test(t.slice(0,200)))t=new TextDecoder('windows-1251').decode(buf);text=t;
    const doc=new DOMParser().parseFromString(t,'text/xml');
    doc.querySelectorAll('*').forEach(n=>{const k=[...n.children].map(c=>c.tagName);if(k.includes('Фамилия')&&k.includes('Имя')){
      const g=x=>n.querySelector(':scope > '+x)?.textContent?.trim()||'';const sum=[...n.querySelectorAll('*')].find(c=>/^Сумма$/i.test(c.tagName))?.textContent;
      rows.push({fio:[g('Фамилия'),g('Имя'),g('Отчество')].filter(Boolean).join(' '),amount:toNum(sum)})}});
  }else{
    await loadXLSX();const wb=XLSX.read(buf,{type:'array'});
    for(const sn of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
      a.forEach(r=>{text+=r.join(' ')+'\n';let fi=r.findIndex(isFio);
        if(fi<0){const j=r.findIndex((c,i)=>/^[А-ЯЁ][а-яё-]+$/.test(String(c).trim())&&/^[А-ЯЁ][а-яё-]+$/.test(String(r[i+1]||'').trim()));if(j>=0){const fio=[r[j],r[j+1],/^[А-ЯЁ][а-яё-]+$/.test(String(r[j+2]||'').trim())?r[j+2]:''].join(' ').trim();r=[...r];r[j]=fio;fi=j}}
        if(fi<0)return;const amts=r.slice(fi+1).map(toNum).filter(n=>n>0&&n<10000000&&!Number.isInteger(n/1e9));
        const amt=amts.find(n=>n>=100&&String(Math.round(n)).length<=7);if(amt)rows.push({fio:String(r[fi]).trim(),amount:amt})})}
  }
  rows=rows.filter(r=>r.fio&&r.amount>0);if(!rows.length)throw new Error('не нашёл строк с ФИО и суммой');
  const reg=(text.match(/(?:реестр|ведомост)\S*\s*№?\s*(\d+)/i)||[])[1]||null;
  return {reg,rows,total:Math.round(rows.reduce((s,r)=>s+r.amount,0)*100)/100};
}
function regMatch(R,unal,fname){
  const cand=unal.filter(o=>(R.reg&&o.registry_no===R.reg)||Math.abs((o.amount-o.allocated)-R.total)<0.01);
  const op=cand.find(o=>R.reg&&o.registry_no===R.reg&&Math.abs((o.amount-o.allocated)-R.total)<0.01)||cand[0];
  if(!op){modal('Реестр',`<div>В реестре ${R.reg?'№'+esc(R.reg)+' ':''}${R.rows.length} чел. на <b>${rub(R.total)}</b>, но в загруженных выписках нет неразнесённого платежа на эту сумму.</div><div class="muted" style="font-size:12px;margin-top:8px">Сначала загрузите банковскую выписку за период, когда был этот платёж.</div>`,[btn('Понятно','',closeModal)]);return}
  const pre=R.rows.map(r=>({fio:r.fio,amount:r.amount,emp:(findEmpByFio(r.fio)||{}).id||''}));
  toast(`${fname}: ${R.rows.length} чел., ${rub(R.total)} — проверьте сотрудников`);
  allocForm(op,pre);
}

const COST_KIND={
 no_chart:['Без техкарты','Блюдо продаётся, а техкарты нет — продажа ничего не списывает со склада, всё уходит в недостачу на инвентаризации'],
 deleted_ingredient:['Удалённый товар','В техкарте товар, удалённый из номенклатуры — он не списывается'],
 foodcost:['Фудкост','Себестоимость по последним ценам прихода выше нормы к средней цене продажи за 30 дней'],
 price_jump:['Подорожания','Цена в последней накладной выше прошлой поставки'],
 stale_ingredient:['Не закупается','Ингредиент техкарты давно не приходил — возможно, его заменили, а техкарту не поправили']};

  case 'no_chart':return `${d.sold_qty?`продано <b>${num(d.sold_qty)}</b> шт на ${rub(d.sold_sum)} за ${d.days} дн.`:'заготовка без техкарты'}${d.group?` <span class="muted">· ${esc(d.group)}</span>`:''}`;
  case 'deleted_ingredient':return `в составе: <b>${esc(d.ingredient)}</b> (${num(d.amount)})`;
  case 'stale_ingredient':return `<b>${esc(d.ingredient)}</b> — ${d.last_delivery?'последний приход '+fd(d.last_delivery)+` (${d.days} дн. назад)`:'приходов не было за '+d.window+' дн.'}`;
  case 'price_jump':return `<b>${num(d.prev_price)} → ${num(d.price)} ₽</b> <span class="pill ${i.severity==='crit'?'r':'y'}">+${num(d.pct)}%</span> ${esc(d.supplier)}, ${fd(d.at)}${d.doc?' № '+esc(d.doc):''}<div class="muted" style="font-size:12px">прошлая поставка ${fd(d.prev_at)}${d.prev_supplier&&d.prev_supplier!==d.supplier?' · '+esc(d.prev_supplier):''}${d.used_in&&d.used_in.length?' · в техкартах: '+esc(d.used_in.join(', ')):''}</div>`;
  case 'foodcost':return `<b>${num(d.pct)}%</b> при норме ${d.limit}% · себестоимость ${rub(d.cost)} / цена ${rub(d.price)}${d.bottle?' <span class="muted">(штучный товар)</span>':''}`;

  ${rows.length?`<div class="tw" style="max-height:66vh"><table><thead><tr><th></th><th>Позиция</th><th>Раздел</th><th>Что не так</th><th>С</th><th></th></tr></thead><tbody>
   ${rows.map(i=>`<tr data-open="${i.id}" style="cursor:pointer;${i.muted?'opacity:.5':''}"><td>${i.severity==='crit'?'<span class="pill r">срочно</span>':'<span class="pill y">внимание</span>'}</td><td><b style="color:var(--accent)">${esc(i.product_name)}</b>${i.note?`<div class="muted" style="font-size:12px">${esc(i.note)}</div>`:''}</td><td>${esc(i.section||'—')}</td><td>${costDetails(i)}</td><td class="muted" style="white-space:nowrap">${fd(i.first_seen.slice(0,10))}</td>
   <td><button class="btn sm" data-mute="${i.id}">${i.muted?'Вернуть':'Не проблема'}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${run?'Здесь всё в порядке':'Нажмите «Проверить сейчас» — первая проверка займёт около минуты'}</div>`}`}`;
  $('#cNew').onclick=()=>cardNew();

  document.querySelectorAll('.tabs a').forEach(a=>{a.classList.toggle('on',a.dataset.t===costTab);a.onclick=()=>{costTab=a.dataset.t;vCost()}});
  $('#cSec').onchange=e=>{costSec=e.target.value;vCost()};
  $('#cMut').onchange=e=>{costMuted=e.target.checked;vCost()};
  $('#cRun').onclick=async e=>{e.target.disabled=true;e.target.textContent='Проверяю… ~1 мин';
    try{const venue=S.venue==='all'?'petrogradka':S.venue;const d=await callCost({action:'check',venue});toast('Готово: проблем '+d.stats.issues+(d.stats.resolved?', закрыто '+d.stats.resolved:''))}
    catch(err){toast('Не получилось: '+err.message)}vCost()};

  document.querySelectorAll('[data-mute]').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=all_.find(x=>String(x.id)===b.dataset.mute);
    if(i.muted){q(sb.from('cost_issues').update({muted:false,updated_by:S.me.uid}).eq('id',i.id)).then(vCost);return}
    modal('Не проблема: '+i.product_name,`<div class="muted" style="margin-bottom:8px">Строка скроется из списка и из утренней сводки. Если проблема уйдёт и появится снова — снова будет скрыта; вернуть можно галочкой «скрытые».</div><label class="f">Почему (необязательно)<input id="mN" placeholder="Например: подаём без списания по решению владельца"></label>`,

}

function shrinkImage(file){return new Promise((ok,bad)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85).split(',')[1])};img.onerror=()=>bad(new Error('не получилось открыть фото'));img.src=URL.createObjectURL(file)})}

// пересчёт строки: количество с листка → в единицах iiko; нетто ↔ брутто через потери
function cardCalc(it){
  const u=(it.unit||'').toLowerCase(),qu=it.qty_unit,q=+it.qty||0;let k=null,warn=null;
  if(/^кг|килогр/.test(u))k=qu==='г'?.001:qu==='кг'?1:qu==='мл'?(warn='мл→кг как 1:1',.001):qu==='л'?(warn='л→кг как 1:1',1):null;
  else if(/^л|литр/.test(u))k=qu==='мл'?.001:qu==='л'?1:qu==='г'?(warn='г→л как 1:1',.001):qu==='кг'?(warn='кг→л как 1:1',1):null;
  else if(/шт|порц|уп/.test(u))k=qu==='шт'?1:null;
  else if(/^г/.test(u))k=qu==='г'?1:qu==='кг'?1000:null;
  const f=(1-(+it.loss_cold||0)/100)*(1-(+it.loss_hot||0)/100)||1;
  const base=k==null?null:q*k;
  const brutto=base==null?null:(it.qty_is==='брутто'?base:base/f),netto=base==null?null:(it.qty_is==='брутто'?base*f:base);
  const cost=brutto!=null&&it.price!=null?brutto*it.price:null;
  const nettoG=netto==null?null:(/^кг|^л|килогр|литр/.test(u)?netto*1000:/^г/.test(u)?netto:null);
  return {brutto,netto,cost,nettoG,warn:k==null&&it.product_id?`единицы не сходятся: ${qu} → ${it.unit||'?'}`:warn}}
const r3=n=>n==null?'':Math.round(n*1000)/1000;

    if(t==='crm_employees')return esc(d.name);return ''};
  const manual=rows.filter(r=>!(r.data&&String(r.data.source||'').startsWith('import'))&&!(r.data&&r.data.note==='импорт 2026'&&r.op==='INSERT'));
  $('#view').innerHTML=manual.length?`<div class="tw"><table><thead><tr><th>Когда</th><th>Кто</th><th>Раздел</th><th>Действие</th><th>Что</th></tr></thead><tbody>${manual.map(r=>`<tr><td class="muted">${new Date(r.at).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(who[r.user_id]||(r.user_id?'—':'система'))}</td><td>${T[r.tbl]||r.tbl}</td><td>${O[r.op]||r.op}</td><td>${sumr(r.tbl,r.data)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Ручных действий пока не было — здесь появятся все изменения касс, табеля и сотрудников</div>';
}

start();
</script>
