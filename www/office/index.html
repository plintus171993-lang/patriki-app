<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Патрики Офис</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../vendor/supabase.js"></script>
<style>
:root{
  --side:#1d2633; --side2:#273244; --sideText:#c4cdd9; --accent:#2f7de1; --accentSoft:#e8f1fc;
  --bg:#f3f5f8; --card:#fff; --line:#e3e7ed; --text:#1d2633; --muted:#6b7686;
  --in:#1f9d55; --inSoft:#e6f6ec; --out:#d64545; --outSoft:#fdecec; --warn:#d98b1c; --warnSoft:#fdf3e3;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--side)}
.loginBox{background:#fff;border-radius:10px;padding:32px;width:340px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.loginBox h1{margin:0 0 4px;font-size:20px}.loginBox p{margin:0 0 20px;color:var(--muted)}
/* layout */
#app{display:flex;min-height:100vh}
aside{width:220px;background:var(--side);color:var(--sideText);flex-shrink:0;display:flex;flex-direction:column}
.brand{padding:18px 20px;font-weight:700;color:#fff;font-size:16px;letter-spacing:.2px;border-bottom:1px solid var(--side2)}
.brand small{display:block;font-weight:400;color:var(--sideText);font-size:12px}
nav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--sideText);text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:var(--side2);color:#fff}
nav a.on{background:var(--side2);color:#fff;border-left-color:var(--accent)}
nav svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.who{margin-top:auto;padding:14px 20px;border-top:1px solid var(--side2);font-size:12px}
.who a{color:#8fb7ef;cursor:pointer}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px}
.top h2{margin:0;font-size:17px;font-weight:600;flex:1}
.content{padding:20px 24px;overflow:auto}
/* controls */
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{border-color:#c5ccd6}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#246bc6}
.btn.green{background:var(--in);border-color:var(--in);color:#fff}
.btn.red{background:var(--out);border-color:var(--out);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;color:var(--text);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accentSoft);border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-bottom:12px}
label.f input,label.f select,label.f textarea{font-size:14px;color:var(--text)}
/* cards */
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.cb{cursor:pointer;transition:border-color .15s}.cb:hover,.cb.sel{border-color:var(--accent)}
.cb .v.neg{color:var(--out)}
h3{font-size:14px;margin:0 0 12px;font-weight:600}
/* tables */
.tw{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto}
table{border-collapse:collapse;width:100%}
th{background:#f7f8fa;text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:8px 12px;border-bottom:1px solid #eef1f4;vertical-align:top}
tr:hover td{background:#fafbfd}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--in)}.out{color:var(--out)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#eef1f4;color:var(--muted);white-space:nowrap}
.pill.g{background:var(--inSoft);color:var(--in)}.pill.r{background:var(--outSoft);color:var(--out)}.pill.y{background:var(--warnSoft);color:var(--warn)}.pill.b{background:var(--accentSoft);color:var(--accent)}
.muted{color:var(--muted)}
.tot td{font-weight:600;background:#f7f8fa}
/* timesheet */
.ts td,.ts th{padding:4px 0;text-align:center;min-width:30px;font-size:12px;border-right:1px solid #eef1f4}
.ts td.nm,.ts th.nm{text-align:left;padding:4px 10px;min-width:170px;position:sticky;left:0;background:#fff;z-index:2}
.ts th.nm{background:#f7f8fa;z-index:3}
.ts td.c{cursor:pointer}
.ts td.c:hover{background:var(--accentSoft)}
.ts td.on{background:#e9f5ee;color:#15693b;font-weight:600}
.ts td.other{background:#fdf6e9;color:var(--warn);font-size:10px}
.ts th.we{color:var(--out)}
.ts tr.grp td{background:#f2f4f7;font-weight:600;text-align:left;padding:5px 10px;font-size:12px;color:var(--muted);position:static}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs a{padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,28,40,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:50}
.mb{background:#fff;border-radius:10px;width:440px;max-width:94vw;max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;display:flex}
.mh span{flex:1}.mh a{cursor:pointer;color:var(--muted)}
.mc{padding:18px 20px}
.mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2>*{min-width:0}label.f input,label.f select{width:100%}
#toast{position:fixed;bottom:20px;right:20px;background:var(--side);color:#fff;padding:10px 16px;border-radius:6px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.err{color:var(--out);font-size:13px;margin-top:8px}
.chart{width:100%;height:220px}
.hbar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.hbar .t{width:170px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{flex:1;height:10px;background:#eef1f4;border-radius:5px;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar .n{width:110px;text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:820px){aside{width:64px}.brand small,nav a span,.who{display:none}.brand{font-size:12px;padding:16px 8px;text-align:center}nav a{justify-content:center;padding:12px 0}.content{padding:14px}}
</style>
</head>
<body>

<div id="login">
  <form class="loginBox" id="loginForm">
    <h1>Патрики Офис</h1>
    <p>Вход для владельца и управляющих</p>
    <label class="f">Email<input id="lEmail" type="email" required autocomplete="username"></label>
    <label class="f">Пароль<input id="lPass" type="password" required autocomplete="current-password"></label>
    <button class="btn pri" style="width:100%">Войти</button>
    <div class="err" id="lErr"></div>
  </form>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brand">ПАТРИКИ<small>Офис · учёт заведений</small></div>
    <nav id="nav"></nav>
    <div class="who"><div id="whoName"></div><a id="logout">Выйти</a></div>
  </aside>
  <main>
    <div class="top">
      <h2 id="title"></h2>
      <select id="venueSel"></select>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<div id="modal" class="hidden"><div class="mb"><div class="mh"><span id="mTitle"></span><a id="mX">✕</a></div><div class="mc" id="mBody"></div><div class="mf" id="mFoot"></div></div></div>
<div id="toast" class="hidden"></div>

<script>
const SB_URL='https://ozbdmczmpejyctezxrdk.supabase.co';
const SB_KEY='sb_publishable_PhI0d9qM0Hp7KrERGKHQfg_668fWJMv';
const sb=supabase.createClient(SB_URL,SB_KEY);

const S={me:null,venues:[],venue:'all',cashboxes:[],employees:[],page:'dash',month:new Date().toISOString().slice(0,7),cbSel:null,cache:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub=n=>(n==null||isNaN(n))?'—':Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ')+' ₽';
const num=n=>(n==null||n==='')?'':(+n).toLocaleString('ru-RU',{maximumFractionDigits:2});
const fd=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'}):'';
const monthName=m=>new Date(m+'-15').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
const daysIn=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const monthEnd=m=>m+'-'+String(daysIn(m)).padStart(2,'0');
const today=()=>new Date(Date.now()+3*3600e3).toISOString().slice(0,10);
const DEPT={bar:'Бар',hall:'Зал',kitchen:'Кухня',dish:'Мойка',admin:'Администрация'};
const KIND={accountable:'Подотчёт',cash:'Наличные',bank:'Безнал / р/с',safe:'Сейф',other:'Другое'};
const CATS_OUT=['Зарплата и авансы','Продукты и напитки','Хозтовары и магазин','Ремонт и обслуживание','Маркетинг и печать','Игровые автоматы','Вывоз, уборка, охрана','Налоги, юристы, штрафы','Связь и IT','Транспорт и доставка','Финансы','Прочее'];
const CATS_IN=['Выручка','Взносы учредителей и займы','Возврат с зарплаты','Итоги инвентаризации','Прочие приходы'];

function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hidden'),2600)}
function modal(title,body,foot){$('#mTitle').textContent=title;$('#mBody').innerHTML=body;$('#mFoot').innerHTML='';(foot||[]).forEach(b=>$('#mFoot').appendChild(b));$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
$('#mX').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function btn(t,cls,fn){const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=t;b.onclick=fn;return b}
async function q(p){const {data,error}=await p;if(error){toast('Ошибка: '+error.message);throw error}return data}
async function all(build){let out=[],from=0;for(;;){const d=await q(build().range(from,from+999));out=out.concat(d);if(d.length<1000)break;from+=1000}return out}
const venueName=id=>(S.venues.find(v=>v.id===id)||{}).name||id||'—';
const vFilter=(qb,col='venue_id')=>S.venue==='all'?qb:qb.eq(col,S.venue);

/* ---------- auth ---------- */
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#lErr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lPass').value});
  if(error){$('#lErr').textContent='Не удалось войти: '+(error.message==='Invalid login credentials'?'неверный email или пароль':error.message);return}
  start()};
$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const me=await q(sb.rpc('crm_me'));
  if(!me.owner&&!me.venues.length){$('#lErr').textContent='У этой учётной записи нет доступа к CRM';await sb.auth.signOut();return}
  S.me=me;
  S.venues=await q(sb.from('venues').select('id,name').order('sort'));
  if(!me.owner){S.venues=S.venues.filter(v=>me.venues.includes(v.id)||me.venues.includes(null))}
  $('#venueSel').innerHTML=(me.owner||S.venues.length>1?'<option value="all">Все заведения</option>':'')+S.venues.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('');
  S.venue=$('#venueSel').value;
  $('#venueSel').onchange=()=>{S.venue=$('#venueSel').value;render()};
  $('#whoName').textContent=(me.name||'')+(me.owner?' · владелец':' · управляющий');
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  await loadRefs();buildNav();
  const h=location.hash.slice(1);if(PAGES.find(p=>p.id===h))S.page=h;
  render();
}
async function loadRefs(){
  S.cashboxes=await q(sb.from('crm_cashbox_balances').select('*').order('sort'));
  S.employees=await q(sb.from('crm_employees').select('*').order('name'));
}

/* ---------- nav ---------- */
const IC={
 dash:'<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>',
 cash:'<path d="M2 6h20v12H2zM6 12a6 6 0 0 0 0 0M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z" fill="none" stroke="currentColor" stroke-width="2"/>',
 ts:'<path d="M4 5h16v15H4zM4 9h16M9 3v4M15 3v4" fill="none" stroke="currentColor" stroke-width="2"/>',
 staff:'<path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 9a7 7 0 0 1 14 0zm15-9a3 3 0 1 0 0-6M22 20a5 5 0 0 0-4-5" fill="none" stroke="currentColor" stroke-width="2"/>',
 pay:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" fill="none" stroke="currentColor" stroke-width="2"/>',
 mot:'<path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z" fill="none" stroke="currentColor" stroke-width="2"/>',
 log:'<path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5" fill="none" stroke="currentColor" stroke-width="2"/>',
 loy:'<path d="M3 7h18v12H3zM3 11h18M7 15h4" fill="none" stroke="currentColor" stroke-width="2"/>'
};
const PAGES=[
 {id:'dash',t:'Сводка',ic:'dash'},{id:'cash',t:'Кассы и деньги',ic:'cash'},{id:'ts',t:'Табель',ic:'ts'},
 {id:'staff',t:'Сотрудники',ic:'staff'},{id:'pay',t:'Зарплата',ic:'pay'},{id:'loy',t:'Система лояльности',ic:'loy',owner:1},{id:'mot',t:'Мотивация',ic:'mot',owner:1},{id:'log',t:'Журнал действий',ic:'log',owner:1}];
function buildNav(){
  $('#nav').innerHTML=PAGES.filter(p=>!p.owner||S.me.owner).map(p=>`<a data-p="${p.id}"><svg viewBox="0 0 24 24" fill="currentColor">${IC[p.ic]}</svg><span>${p.t}</span></a>`).join('');
  $('#nav').querySelectorAll('a').forEach(a=>a.onclick=()=>{S.page=a.dataset.p;location.hash=S.page;render()});
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==S.page&&PAGES.find(p=>p.id===h)){S.page=h;render()}});
function render(){
  $('#nav').querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.p===S.page));
  const p=PAGES.find(p=>p.id===S.page);$('#title').textContent=p.t;
  $('#view').innerHTML='<div class="empty">Загрузка…</div>';
  ({dash:vDash,cash:vCash,ts:vTs,staff:vStaff,pay:vPay,loy:vLoy,mot:vMot,log:vLog})[S.page]().catch(e=>{console.error(e);$('#view').innerHTML='<div class="empty">Не удалось загрузить данные</div>'});
}
function monthPicker(id){return `<input type="month" id="${id}" value="${S.month}">`}
function bindMonth(id){$('#'+id).onchange=e=>{S.month=e.target.value;render()}}

/* ---------- Сводка ---------- */
async function vDash(){
  const m=S.month,from=m+'-01',to=monthEnd(m);
  const rev=await q(vFilter(sb.from('crm_daily_revenue').select('*')).gte('day',from).lte('day',to).order('day'));
  const cbIds=S.cashboxes.filter(c=>S.venue==='all'||c.venue_id===S.venue).map(c=>c.id);
  const ops=cbIds.length?await all(()=>sb.from('crm_cash_ops').select('amount,direction,category,transfer_id').in('cashbox_id',cbIds).gte('op_date',from).lte('op_date',to)):[];
  const pay=await q(vFilter(sb.from('crm_payroll').select('total')).eq('month',from));
  const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
  const cashless=sum(rev,r=>r.cashless),cash=sum(rev,r=>r.cash),total=cashless+cash;
  const exp=ops.filter(o=>o.direction==='out'&&!o.transfer_id&&o.category!=='Корректировка остатка');
  const expSum=sum(exp,o=>o.amount),fot=sum(pay,p=>p.total);
  const byCat={};exp.forEach(o=>byCat[o.category||'Прочее']=(byCat[o.category||'Прочее']||0)+ +o.amount);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const maxC=cats.length?cats[0][1]:1;
  const kitchen=sum(rev,r=>r.kitchen_turnover),bar=sum(rev,r=>r.bar_turnover),fee=sum(rev,r=>r.service_fee);
  $('#view').innerHTML=`
  <div class="bar">${monthPicker('dm')}<span class="muted">${monthName(m)}</span><span class="sp"></span>${S.me.owner?'<button class="btn pri" id="bIiko">⟳ Выручка из iiko</button>':''}</div>
  <div class="grid k4">
    ${kpi('Выручка',rub(total),rev.length?`${rev.length} дн. · в среднем ${rub(total/rev.length)}`:'нет данных')}
    ${kpi('Безнал',rub(cashless),total?Math.round(cashless/total*100)+'% выручки':'')}
    ${kpi('Наличные по кассе',rub(cash),total?Math.round(cash/total*100)+'% выручки':'')}
    ${kpi('Кухня / бар',rub(kitchen)+'<br><span style="font-size:16px">'+rub(bar)+'</span>','оборот по iiko')}
    ${kpi('Расходы из касс',rub(expSum),exp.length+' операций')}
    ${kpi('Фонд оплаты труда',rub(fot),pay.length?pay.length+' в ведомости':'ведомость не закрыта')}
  </div>
  <div class="grid" style="grid-template-columns:2fr 1fr;margin-top:14px">
    <div class="card"><h3>Выручка по дням</h3>${revChart(rev,m)}<div class="muted" style="font-size:12px;margin-top:6px"><span style="color:var(--accent)">■</span> безнал &nbsp; <span style="color:#7fb3f0">■</span> наличные по кассе${fee?` &nbsp;·&nbsp; сервисный сбор за месяц: ${rub(fee)}`:''}</div></div>
    <div class="card"><h3>Расходы по категориям</h3>${cats.length?cats.map(([c,v])=>`<div class="hbar"><span class="t" title="${esc(c)}">${esc(c)}</span><span class="b"><i style="width:${v/maxC*100}%"></i></span><span class="n">${rub(v)}</span></div>`).join(''):'<div class="empty">Нет расходов</div>'}</div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Остатки касс</h3><div class="grid k4">${cbCards()}</div></div>`;
  bindMonth('dm');
  if(S.me.owner)$('#bIiko').onclick=iikoForm;
  document.querySelectorAll('.cb').forEach(c=>c.onclick=()=>{S.cbSel=c.dataset.id;S.page='cash';location.hash='cash';render()});
}
const kpi=(l,v,s)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`;
function cbCards(){const list=S.cashboxes.filter(c=>S.venue==='all'||c.venue_id===S.venue);
  return list.length?list.map(c=>`<div class="card kpi cb ${S.cbSel===c.id?'sel':''}" data-id="${c.id}"><div class="l">${esc(KIND[c.kind]||c.kind)} · ${esc(venueName(c.venue_id))}</div><div class="v ${c.balance<0?'neg':''}">${rub(c.balance)}</div><div class="s">${esc(c.name)}${c.iiko_pay_type?' · <span class="pill b">iiko</span>':''}${c.last_op?' · посл. операция '+fd(c.last_op):''}</div></div>`).join(''):'<div class="empty">Касс нет</div>'}
function revChart(rev,m){
  const n=daysIn(m),by={};rev.forEach(r=>{const d=+r.day.slice(8);by[d]=by[d]||{a:0,b:0};by[d].a+=+r.cashless||0;by[d].b+=+r.cash||0});
  const max=Math.max(1,...Object.values(by).map(x=>x.a+x.b));const W=700,H=200,bw=W/n;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H+20}" preserveAspectRatio="none">`;
  for(let g=1;g<=3;g++){const y=H-H*g/4;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#eef1f4"/><text x="2" y="${y-3}" font-size="10" fill="#9aa4b2">${Math.round(max*g/4/1000)}k</text>`}
  for(let d=1;d<=n;d++){const x=(d-1)*bw+bw*.15,w=bw*.7,v=by[d]||{a:0,b:0};const ha=v.a/max*H,hb=v.b/max*H;
    const wd=new Date(m+'-'+String(d).padStart(2,'0')+'T12:00:00').getDay();
    s+=`<g><title>${d}.${m.slice(5)}: ${rub(v.a+v.b)}</title><rect x="${x}" y="${H-ha}" width="${w}" height="${ha}" fill="#2f7de1" rx="1"/><rect x="${x}" y="${H-ha-hb}" width="${w}" height="${hb}" fill="#7fb3f0" rx="1"/></g>`;
    if(n<=31)s+=`<text x="${x+w/2}" y="${H+14}" font-size="9" text-anchor="middle" fill="${wd===0||wd===6?'#d64545':'#9aa4b2'}">${d}</text>`}
  return s+'</svg>'}

async function vTs(){
  const m=S.month,n=daysIn(m),from=m+'-01',to=monthEnd(m);
  const venue=S.venue==='all'?(S.venues[0]||{}).id:S.venue;
  const shifts=await all(()=>sb.from('crm_shifts').select('*').gte('day',from).lte('day',to));
  const emps=S.employees.filter(e=>e.active&&e.dept!=='admin');
  const map={};shifts.forEach(s=>{(map[s.employee_id]=map[s.employee_id]||{})[+s.day.slice(8)]=s});
  const groups=['bar','hall','kitchen','dish'];
  const dayHdr=[...Array(n)].map((_,i)=>{const wd=new Date(m+'-'+String(i+1).padStart(2,'0')+'T12:00:00').getDay();return `<th class="${wd===0||wd===6?'we':''}">${i+1}</th>`}).join('');
  let rows='';
  for(const g of groups){const es=emps.filter(e=>e.dept===g&&(e.home_venue===venue||Object.values(map[e.id]||{}).some(s=>s.venue_id===venue)||!e.home_venue));if(!es.length)continue;
    rows+=`<tr class="grp"><td colspan="${n+3}">${DEPT[g]}</td></tr>`;
    for(const e of es){let tot=0,cnt=0,cells='';
      for(let d=1;d<=n;d++){const s=(map[e.id]||{})[d];
        if(s&&s.venue_id===venue){const v=g==='dish'?s.amount:s.hours;tot+=+v||0;cnt++;cells+=`<td class="c on" data-e="${e.id}" data-d="${d}">${g==='dish'?Math.round((+v||0)/100)/10+'k':num(v)}</td>`}
        else if(s){cells+=`<td class="c other" data-e="${e.id}" data-d="${d}" title="Работал: ${esc(venueName(s.venue_id))}">${esc(venueName(s.venue_id).slice(0,3))}</td>`}
        else cells+=`<td class="c" data-e="${e.id}" data-d="${d}"></td>`}
      rows+=`<tr><td class="nm">${esc(e.name)} <span class="muted" style="font-size:11px">${esc(e.position||'')}</span></td>${cells}<td class="n" style="padding:4px 10px;min-width:90px"><b>${g==='dish'?rub(tot):num(tot)+' ч'}</b></td><td class="n muted" style="padding:4px 10px;min-width:60px">${cnt} см.</td></tr>`}}
  $('#view').innerHTML=`<div class="bar">${monthPicker('tm')}<span class="muted">${esc(venueName(venue))}${S.venue==='all'?' (выберите заведение вверху)':''} · нажмите на клетку, чтобы отметить смену</span><span class="sp"></span>

  bindMonth('tm');
  document.querySelectorAll('.ts td.c').forEach(td=>td.onclick=()=>shiftForm(td.dataset.e,m+'-'+String(td.dataset.d).padStart(2,'0'),(map[td.dataset.e]||{})[+td.dataset.d],venue));
}

  ${rows.map(e=>`<tr data-id="${e.id}" style="cursor:${S.me.owner?'pointer':'default'}"><td><b>${esc(e.name)}</b></td><td>${esc(e.position||'')}</td><td>${DEPT[e.dept]||''}</td><td>${esc(venueName(e.home_venue))}</td><td>${e.iiko_employee_id?'<span class="pill b">связан</span>':'<span class="muted">—</span>'}</td><td>${e.active?'<span class="pill g">работает</span>':'<span class="pill r">уволен</span>'}</td></tr>`).join('')}
  </tbody></table></div>`;
  $('#sOff').onchange=e=>{S.cache.showOff=e.target.checked;vStaff()};
  if(S.me.owner){$('#sAdd').onclick=()=>empForm();document.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>empForm(S.employees.find(e=>e.id===r.dataset.id)))}
}
function empForm(e){
  modal(e?'Сотрудник':'Новый сотрудник',`
    <label class="f">Имя<input id="eN" value="${esc(e?.name||'')}"></label>
    <div class="row2"><label class="f">Должность<input id="eP" value="${esc(e?.position||'')}" list="posList"></label>
    <label class="f">Отдел<select id="eD">${Object.entries(DEPT).map(([k,v])=>`<option value="${k}" ${e?.dept===k?'selected':''}>${v}</option>`).join('')}</select></label></div>
    <datalist id="posList">${[...new Set(S.employees.map(x=>x.position).filter(Boolean))].map(p=>`<option>${esc(p)}</option>`).join('')}</datalist>
    <label class="f">Основная точка<select id="eV">${S.venues.map(v=>`<option value="${v.id}" ${e?.home_venue===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label>
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="eA" ${!e||e.active?'checked':''}> работает</label><div class="err" id="eErr"></div>`,
    [btn('Отмена','',closeModal),btn('Сохранить','pri',async()=>{
      const row={name:$('#eN').value.trim(),position:$('#eP').value.trim()||null,dept:$('#eD').value,home_venue:$('#eV').value,active:$('#eA').checked};
      if(!row.name){$('#eErr').textContent='Укажите имя';return}
      if(e)await q(sb.from('crm_employees').update(row).eq('id',e.id));else await q(sb.from('crm_employees').insert(row));
      closeModal();toast('Сохранено');vStaff()})]);
}

/* ---------- Зарплата ---------- */
async function vPay(){
  const m=S.month,from=m+'-01',to=monthEnd(m);
  const [pay,shifts,rules]=await Promise.all([
    q(vFilter(sb.from('crm_payroll').select('*')).eq('month',from)),
    all(()=>vFilter(sb.from('crm_shifts').select('employee_id,venue_id,hours,amount')).gte('day',from).lte('day',to)),
    S.me.owner?q(sb.from('crm_motivation_rules').select('*').eq('active',true).lte('valid_from',to)):Promise.resolve([])]);
  const hourly=(rules.filter(r=>r.kind==='hourly'&&(!r.valid_to||r.valid_to>=from)).pop()||{params:{}}).params.by_position||{};
  const en=id=>S.employees.find(e=>e.id===id)||{};
  const agg={};shifts.forEach(s=>{const a=agg[s.employee_id]=agg[s.employee_id]||{h:0,a:0,c:0};a.h+=+s.hours||0;a.a+=+s.amount||0;a.c++});
  const sum=f=>pay.reduce((s,p)=>s+(+p[f]||0),0);
  const deptOrder=['bar','hall','kitchen','dish','admin'];
  pay.sort((a,b)=>deptOrder.indexOf(en(a.employee_id).dept)-deptOrder.indexOf(en(b.employee_id).dept)||(en(a.employee_id).name||'').localeCompare(en(b.employee_id).name||''));
  const draft=Object.entries(agg).filter(([id])=>!pay.find(p=>p.employee_id===id)).map(([id,a])=>{const e=en(id),r=hourly[e.position];return {e,a,base:e.dept==='dish'?a.a:(r?a.h*r:null),r}});
  $('#view').innerHTML=`<div class="bar">${monthPicker('pm')}<span class="muted">${monthName(m)}</span></div>
  ${pay.length?`<div class="tw"><table><thead><tr><th>Сотрудник</th><th>Должность</th><th class="n">Часы</th><th class="n">Ставка</th><th class="n">ЗП</th><th class="n">План</th><th class="n">Мотивация</th><th class="n">Сервис</th><th class="n">Штрафы</th><th class="n">Начислено</th><th class="n">Аванс</th><th class="n">Выдано</th><th class="n">Остаток</th></tr></thead><tbody>
  ${pay.map(p=>{const e=en(p.employee_id);return `<tr><td><b>${esc(e.name)}</b></td><td class="muted">${esc(e.position||'')}</td><td class="n">${num(p.hours)}</td><td class="n">${num(p.rate)}</td><td class="n">${rub(p.base)}</td><td class="n">${p.plan_bonus?rub(p.plan_bonus):''}</td><td class="n">${p.motivation?rub(p.motivation):''}</td><td class="n">${p.service?rub(p.service):''}</td><td class="n out">${p.fines?rub(p.fines):''}</td><td class="n"><b>${rub(p.total)}</b></td><td class="n">${rub((+p.advance||0)+(+p.adv_official||0))}</td><td class="n">${rub(p.paid)}</td><td class="n ${p.balance<0?'out':''}">${rub(p.balance)}</td></tr>`}).join('')}
  <tr class="tot"><td colspan="4">Итого · ${pay.length} чел.</td><td class="n">${rub(sum('base'))}</td><td class="n">${rub(sum('plan_bonus'))}</td><td class="n">${rub(sum('motivation'))}</td><td class="n">${rub(sum('service'))}</td><td class="n">${rub(sum('fines'))}</td><td class="n">${rub(sum('total'))}</td><td class="n">${rub(sum('advance')+sum('adv_official'))}</td><td class="n">${rub(sum('paid'))}</td><td class="n">${rub(sum('balance'))}</td></tr></tbody></table></div>`:''}
  ${draft.length?`<div class="card" style="margin-top:14px"><h3>По табелю за ${monthName(m)} — предварительно</h3><div class="muted" style="font-size:12px;margin-bottom:10px">Ведомость за этот месяц ещё не закрыта. Ниже — база по отмеченным сменам и ставкам; премии и сервисный сбор добавятся при расчёте.</div>
  <div class="tw"><table><thead><tr><th>Сотрудник</th><th>Должность</th><th class="n">Смен</th><th class="n">Часы</th><th class="n">Ставка</th><th class="n">База</th></tr></thead><tbody>
  ${draft.map(d=>`<tr><td><b>${esc(d.e.name)}</b></td><td class="muted">${esc(d.e.position||'')}</td><td class="n">${d.a.c}</td><td class="n">${d.e.dept==='dish'?'—':num(d.a.h)}</td><td class="n">${d.e.dept==='dish'?'за смену':d.r?num(d.r):'<span class="muted">не задана</span>'}</td><td class="n">${d.base!=null?rub(d.base):'—'}</td></tr>`).join('')}
  </tbody></table></div></div>`:''}
  ${!pay.length&&!draft.length?'<div class="empty">За этот месяц нет ни ведомости, ни смен</div>':''}`;
  bindMonth('pm');
}

/* ---------- Система лояльности ---------- */
async function vLoy(){
  const [list,st]=await Promise.all([q(sb.rpc('crm_loyalty_list')),q(sb.rpc('loyalty_stats'))]);
  list.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  const app=list.filter(x=>x.kind==='app'),imp=list.filter(x=>x.kind==='import');
  const sum=a=>a.reduce((s,x)=>s+(+x.balance||0),0);
  const since=d=>app.filter(x=>x.created_at&&Date.now()-new Date(x.created_at)<d*864e5).length;
  const f=S.cache.loyF||(S.cache.loyF={src:'',s:''});
  $('#view').innerHTML=`<div class="grid k4">
    ${kpi('Баланс баллов всего',num(sum(list)),'приложение '+num(sum(app))+' · перенесённые карты '+num(sum(imp)))}
    ${kpi('Гостей в приложении',app.length,app.filter(x=>x.verified).length+' с подтверждённым номером')}
    ${kpi('Новых гостей',since(7)+' / '+since(30),'за 7 / 30 дней')}
    ${kpi('Перенесённые карты',imp.length,'ещё не привязаны к приложению'+(st?' · привязано '+st.imported_claimed:''))}
    ${st?kpi('Начислено за 30 дней',num(st.accrued_30),'списано '+num(st.redeemed_30)):''}
  </div>
  <div class="bar" style="margin-top:14px"><select id="lSrc"><option value="">Все карты</option><option value="app">Приложение</option><option value="import">Перенесённые (MACE)</option></select>
    <input id="lS" placeholder="Имя, телефон или номер карты" value="${esc(f.s)}" style="width:260px"><span class="sp"></span><span class="muted" id="lCnt"></span></div>
  <div id="lTbl"></div>`;
  $('#lSrc').value=f.src;
  const draw=()=>{f.src=$('#lSrc').value;f.s=$('#lS').value.trim().toLowerCase();
    const rows=list.filter(x=>(!f.src||x.kind===f.src)&&(!f.s||[x.name,x.phone,x.card_no].some(v=>(v||'').toLowerCase().includes(f.s))));
    $('#lCnt').textContent=rows.length+' карт · '+num(sum(rows))+' баллов';
    $('#lTbl').innerHTML=rows.length?`<div class="tw" style="max-height:60vh"><table><thead><tr><th>Гость</th><th>Телефон</th><th>Карта</th><th>Откуда</th><th>Уровень</th><th class="n">Баланс</th><th class="n">Потрачено</th><th>Создана</th><th>Активность</th></tr></thead><tbody>
    ${rows.map((x,i)=>`<tr data-i="${list.indexOf(x)}" style="cursor:pointer"><td><b>${esc(x.name||'—')}</b>${x.kind==='app'&&x.verified?' <span class="pill g">✓</span>':''}</td><td>${esc(x.phone||'')}</td><td class="muted">${esc(x.card_no||'')}</td><td>${x.kind==='app'?'<span class="pill b">приложение</span>':'<span class="pill">перенос</span>'}</td><td>${esc(x.level||'')}</td><td class="n"><b>${num(x.balance)}</b></td><td class="n">${rub(x.spent)}</td><td class="muted">${x.created_at?new Date(x.created_at).toLocaleDateString('ru-RU'):''}</td><td class="muted">${x.last_activity_at?new Date(x.last_activity_at).toLocaleDateString('ru-RU'):''}</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">Ничего не найдено</div>';
    document.querySelectorAll('#lTbl tr[data-i]').forEach(r=>r.onclick=()=>loyForm(list[+r.dataset.i]))};
  $('#lSrc').onchange=draw;$('#lS').oninput=()=>{clearTimeout(S._t);S._t=setTimeout(draw,250)};draw();
}
async function loyForm(x){
  modal(x.name||'Карта гостя',`<div class="muted" style="font-size:12px;margin-bottom:10px">${x.kind==='app'?'Гость приложения':'Перенесённая карта (MACE), ещё не привязана к приложению'} · ${esc(x.phone||'')} · карта ${esc(x.card_no||'—')}</div>
    <div class="row2"><label class="f">Имя<input id="gN" value="${esc(x.name||'')}"></label><label class="f">День рождения<input type="date" id="gB" value="${x.birthday||''}"></label></div>
    <div class="row2"><label class="f">Баланс сейчас<input value="${num(x.balance)}" disabled></label><label class="f">Начислить (+) / списать (−)<input type="number" id="gD" step="1" placeholder="0"></label></div>
    <label class="f">Причина корректировки<input id="gC" placeholder="Например: компенсация за долгую доставку"></label>
    <div class="err" id="gErr"></div><h3 style="margin-top:14px">История</h3><div id="gH"><div class="empty">Загрузка…</div></div>`,
    [btn('Закрыть','',closeModal),btn('Сохранить','pri',async()=>{
      const d=parseInt($('#gD').value||'0',10);
      if(d&&(+x.balance+d)<0){$('#gErr').textContent='Баланс не может стать меньше нуля';return}
      if(d&&!$('#gC').value.trim()){$('#gErr').textContent='Укажите причину корректировки';return}
      await q(sb.rpc('crm_loyalty_edit',{p_kind:x.kind,p_id:x.id,p_name:$('#gN').value,p_birthday:$('#gB').value||null,p_delta:d,p_note:$('#gC').value.trim()}));
      closeModal();toast('Сохранено');vLoy()})]);
  const KND={accrue:'начислено',pending:'начисление (ожидает)',redeem:'списано',refund:'возврат',bonus:'бонус',adjust:'корректировка',expire:'сгорание',reverse:'отмена',import:'перенос'};
  const h=await q(sb.rpc('crm_loyalty_history',{p_kind:x.kind,p_id:x.id}));
  $('#gH').innerHTML=h.length?`<div class="tw"><table><tbody>${h.map(t=>`<tr><td class="muted">${new Date(t.created_at).toLocaleDateString('ru-RU')}</td><td>${KND[t.kind]||t.kind}${t.note?' · '+esc(t.note):''}</td><td class="n ${t.points<0?'out':'in'}">${t.points>0?'+':''}${num(t.points)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">Операций нет</div>';
}

/* ---------- Мотивация ---------- */
async function vMot(){
  const rules=await q(sb.from('crm_motivation_rules').select('*').order('kind').order('valid_from'));
  const per=r=>`с ${fd(r.valid_from)}${r.valid_to?' по '+fd(r.valid_to):''}`;
  const T={sun_wed:'Вс–Ср',thu:'Чт',fri_sat:'Пт–Сб'};
  const desc=r=>{const p=r.params||{};
    if(r.kind==='revenue_tiers')return `<table style="width:auto;margin-top:6px"><tr><th></th><th class="n">Порог 1</th><th class="n">Порог 2</th><th class="n">Порог 3</th></tr>${Object.entries(p.tiers||{}).map(([k,t])=>`<tr><td>${T[k]||k}</td>${t.map(([a,b])=>`<td class="n">${rub(a)} → <b>${rub(b)}</b></td>`).join('')}</tr>`).join('')}</table><div class="muted" style="font-size:12px;margin-top:6px">Считается от официальной выручки дня (безнал + наличные по кассе), делится поровну между барменами на смене.</div>`;
    if(r.kind==='service_fee')return `Удерживается ${p.withhold_pct}%, остаток поровну между барменами на смене.`;
    if(r.kind==='chef_kitchen_pct')return `${p.pct}% с оборота кухни за месяц сверх ${rub(p.threshold)}.`;
    if(r.kind==='hourly')return Object.entries(p.by_position||{}).map(([k,v])=>`${esc(k)}: <b>${v} ₽/ч</b>`).join(' · ');
    if(r.kind==='daily_amount')return `По умолчанию <b>${rub(p.default)}</b> за смену.`;
    if(r.kind==='monthly_salary')return 'Оклад задаётся в ведомости по каждому сотруднику.';
    return '<code>'+esc(JSON.stringify(p))+'</code>'};
  $('#view').innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr))">${rules.map(r=>`<div class="card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><h3 style="margin:0;flex:1">${esc(r.name)}</h3>${r.valid_to&&r.valid_to<today()?'<span class="pill">архив</span>':'<span class="pill g">действует</span>'}</div><div class="muted" style="font-size:12px;margin-bottom:8px">${esc(venueName(r.venue_id))} · ${per(r)}</div>${desc(r)}</div>`).join('')}</div>`;
}

/* ---------- Журнал ---------- */
async function vLog(){
  const rows=await q(sb.from('crm_audit').select('*').order('at',{ascending:false}).limit(300));
  const T={crm_cash_ops:'Касса',crm_transfers:'Перемещение',crm_shifts:'Табель',crm_payroll:'Зарплата',crm_employees:'Сотрудник'};
  const O={INSERT:'<span class="pill g">создано</span>',UPDATE:'<span class="pill y">изменено</span>',DELETE:'<span class="pill r">удалено</span>'};
  const sumr=(t,d)=>{if(!d)return'';if(t==='crm_cash_ops')return `${d.direction==='in'?'приход':'расход'} ${rub(d.amount)} · ${esc(d.category||'')} · ${esc(d.comment||'')}`;
    if(t==='crm_transfers')return `${rub(d.amount)} · ${d.status}`;if(t==='crm_shifts')return `${esc((S.employees.find(e=>e.id===d.employee_id)||{}).name||'')} · ${fd(d.day)} · ${d.hours??''}${d.amount?rub(d.amount):''}`;
    if(t==='crm_employees')return esc(d.name);return ''};
  const manual=rows.filter(r=>!(r.data&&String(r.data.source||'').startsWith('import'))&&!(r.data&&r.data.note==='импорт 2026'&&r.op==='INSERT'));
  $('#view').innerHTML=manual.length?`<div class="tw"><table><thead><tr><th>Когда</th><th>Раздел</th><th>Действие</th><th>Что</th></tr></thead><tbody>${manual.map(r=>`<tr><td class="muted">${new Date(r.at).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'})}</td><td>${T[r.tbl]||r.tbl}</td><td>${O[r.op]||r.op}</td><td>${sumr(r.tbl,r.data)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Ручных действий пока не было — здесь появятся все изменения касс, табеля и сотрудников</div>';
}

start();
</script>
</body>
</html>
