<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Патрики Паб — доставка</title>
<meta name="description" content="Доставка из паба «Патрики»: мясо из смокера, бургеры и закуски. Петроградская сторона и Мурино.">
<meta name="theme-color" content="#0E0E0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Патрики">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">

</head>
<body>
<div id="app"><div class="pk-loader" role="status" aria-live="polite"><div class="pk-stage" aria-hidden="true"><svg class="pk-ring" viewBox="0 0 160 160"><circle cx="80" cy="80" r="76"/></svg><img class="pk-dog" src="img/emblem.svg" width="120" height="120" alt=""></div><span class="pk-shadow" aria-hidden="true"></span><span class="pk-load-text">Будим бульдога…</span></div></div>
<script>
// Меняем подписи под бульдогом, пока грузится меню
(function(){var t=["Будим бульдога…","Разжигаем смокер…","Режем брискет…","Ищем меню в будке…"],i=0;window.__pkLoaderTimer=setInterval(function(){var e=document.querySelector(".pk-load-text");if(!e)return clearInterval(window.__pkLoaderTimer);e.textContent=t[++i%t.length];},1400);})();
</script>
<script src="vendor/qrcode.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
