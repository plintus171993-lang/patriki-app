name: iiko plugin

on:
  push:
    paths:
      - 'iiko-plugin/**'
      - '.github/workflows/iiko-plugin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        working-directory: iiko-plugin/Resto.Front.Api.Patriki
        run: |
          set -o pipefail
          dotnet build -c Release 2>&1 | tee build.log || {
            echo '## Ошибки сборки' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error|Error|warning NU|ошибк" build.log | sort -u | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1; }
      - name: Collect
        run: |
          OUT=iiko-plugin/Resto.Front.Api.Patriki/bin/Release
          find $OUT -type f | sort
          DLL=$(find $OUT -name Resto.Front.Api.Patriki.dll | head -1)
          mkdir -p dist/Resto.Front.Api.Patriki
          cp -r "$(dirname "$DLL")"/. dist/Resto.Front.Api.Patriki/
          rm -f dist/Resto.Front.Api.Patriki/*.pdb
          cp iiko-plugin/INSTALL.txt iiko-plugin/patriki.json dist/
          find dist -type f | sort
          echo '## Состав плагина' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find dist $OUT -type f | sort >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: Resto.Front.Api.Patriki
          path: |
            dist/
            iiko-plugin/Resto.Front.Api.Patriki/bin/Release/**/*.zip
      - name: Publish to branch iiko-plugin-dist
        run: |
          cd dist
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b iiko-plugin-dist
          git add -A
          git commit -q -m "Плагин iiko ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" iiko-plugin-dist
