# Сборка Android-приложения (APK) и публикация веб-версии на GitHub Pages.
# Запускается при каждом изменении в ветке main, либо вручную: Actions → Build → Run workflow.
name: Build

on:
  push:
    branches: [main]
    # плагин iiko, серверные функции и база не меняют приложение у гостей — их изменения сборку не запускают
    paths-ignore:
      - 'iiko-plugin/**'
      - '.github/workflows/iiko-plugin.yml'
      - 'supabase/**'
      - 'site/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новая сборка ждёт окончания предыдущей, а не обрывает её на середине публикации сайта
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установка Capacitor и Supabase
        run: |
          npm install --no-audit --no-fund
          mkdir -p www/vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.js
          cp node_modules/qrcode-generator/qrcode.js www/vendor/qrcode.js
          # шрифты внутри приложения (без Google Fonts — быстрее при плохом интернете и VPN)
          mkdir -p www/vendor/fonts
          cp node_modules/@fontsource/oswald/files/oswald-{cyrillic,latin}-{500,700}-normal.woff2 www/vendor/fonts/
          cp node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-{cyrillic,latin}-{400,500,600}-normal.woff2 www/vendor/fonts/
          # номер сборки — по нему приложение понимает, что вышло обновление; он же — версия кэша service worker
          echo "window.PK_BUILD = ${{ github.run_number }};" > www/js/build.js
          sed -i "s/^const BUILD = 'dev';/const BUILD = '${{ github.run_number }}';/" www/sw.js

      - name: Android-проект, иконки и заставка
        run: |
          # метка «установлено с сайта» — приложение по ней понимает, как предлагать обновление
          python3 -c "import json;p='capacitor.config.json';c=json.load(open(p,encoding='utf-8'));c.setdefault('android',{})['appendUserAgent']=' PatrikiApp/site';json.dump(c,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          npx cap add android
          # камера — для «Кассы · QR» в админке (сканирование карты гостя)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0E0E0D' --iconBackgroundColorDark '#0E0E0D' \
            --splashBackgroundColor '#0E0E0D' --splashBackgroundColorDark '#0E0E0D'
          npx cap sync android
          # Номер версии растёт с каждой сборкой, чтобы обновление ставилось поверх старой версии
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "::warning::Ключ подписи не задан — собираю отладочную версию. Добавьте секреты ANDROID_KEYSTORE_* (см. README)."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Подпись APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p out
          # Пароль могли вставить вместе с подписью или целым куском инструкции —
          # берём строку «Пароль: …» или «ANDROID_KEYSTORE_PASSWORD = …», если она есть
          RAW="$KS_PASS"
          LINE="$(printf '%s\n' "$RAW" | grep -m1 'Пароль:' || true)"
          if [ -n "$LINE" ]; then RAW="${LINE#*:}";
          else LINE="$(printf '%s\n' "$RAW" | grep -m1 'ANDROID_KEYSTORE_PASSWORD' || true)"; [ -n "$LINE" ] && RAW="${LINE#*=}"; fi
          export KS_PASS="$(printf '%s' "$RAW" | tr -d '[:space:]')"
          KS_B64="$(printf '%s' "$KS_B64" | tr -d '[:space:]')"
          echo "Длина пароля после очистки: ${#KS_PASS} (ожидается 24)"
          if [ -n "$KS_B64" ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            echo "$KS_B64" | base64 -d > release.jks
            $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            # в файле ключа один ключ, поэтому имя (alias) указывать не нужно
            $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --out out/patriki.apk aligned.apk
            $BT/apksigner verify out/patriki.apk
            rm -f release.jks
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/patriki.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: patriki-apk
          path: out/patriki.apk

  pages:
    needs: android
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: patriki-apk
          path: www/download

      - name: Библиотека Supabase внутрь сайта
        run: |
          # те же версии, что и в Android-сборке (из package.json), чтобы сайт и APK не расходились
          npm install --no-audit --no-fund
          mkdir -p www/vendor/fonts
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.js
          cp node_modules/qrcode-generator/qrcode.js www/vendor/qrcode.js
          cp node_modules/@fontsource/oswald/files/oswald-{cyrillic,latin}-{500,700}-normal.woff2 www/vendor/fonts/
          cp node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-{cyrillic,latin}-{400,500,600}-normal.woff2 www/vendor/fonts/
          ls www/vendor/fonts
          sed -i "s/^const BUILD = 'dev';/const BUILD = '${{ github.run_number }}';/" www/sw.js
          grep -n "^const BUILD" www/sw.js
          # приложение официантов: номер сборки — для автообновления на телефонах
          sed -i "s/^const BUILD = 'dev';/const BUILD = '${{ github.run_number }}';/" www/waiter/waiter.js
          sed -i "s/^const CACHE = 'waiter-v[0-9]*';/const CACHE = 'waiter-${{ github.run_number }}';/" www/waiter/sw.js
          python3 -c "import json;c=json.load(open('www/waiter/update.json'));json.dump({'build':${{ github.run_number }},'apk_min':int(c.get('apk_min',0))},open('www/waiter/version.json','w'))"
          cat www/waiter/version.json; grep -n "^const BUILD" www/waiter/waiter.js

      # Обновление без переустановки: архив веб-части + update/latest.json.
      # Приложение сравнивает build со своим и предлагает обновиться.
      # apk_min в update.json поднимаем, только если меняется нативная часть (плагины, разрешения).
      - name: Пакет обновления
        run: |
          BUILD=${{ github.run_number }}
          echo "window.PK_BUILD = $BUILD;" > www/js/build.js
          (cd www && zip -qr ../web-$BUILD.zip . -x 'download/*' 'update/*')
          mkdir -p www/update
          mv web-$BUILD.zip www/update/
          VERSION=$(grep -o "APP_VERSION: '[^']*'" www/js/config.js | cut -d"'" -f2)
          python3 - "$BUILD" "$VERSION" <<'PY'
          import json, sys
          build, version = int(sys.argv[1]), sys.argv[2]
          cfg = json.load(open('update.json', encoding='utf-8'))
          out = {
              'build': build,
              'version': version,
              'url': f'https://patrikipab.ru/update/web-{build}.zip',
              'apk': 'https://patrikipab.ru/download/patriki.apk',
              'apk_min': int(cfg.get('apk_min', 0)),
              'store_min': cfg.get('store_min', {}),
              'notes': cfg.get('notes', []),
          }
          json.dump(out, open('www/update/latest.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print(out)
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deploy
        uses: actions/deploy-pages@v4
