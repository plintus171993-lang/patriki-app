# Сборка Android-приложения (APK) и публикация веб-версии на GitHub Pages.
# Запускается при каждом изменении в ветке main, либо вручную: Actions → Build → Run workflow.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установка Capacitor и Supabase
        run: |
          npm install --no-audit --no-fund
          mkdir -p www/vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.js

      - name: Android-проект, иконки и заставка
        run: |
          npx cap add android
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0E0E0D' --iconBackgroundColorDark '#0E0E0D' \
            --splashBackgroundColor '#0E0E0D' --splashBackgroundColorDark '#0E0E0D'
          npx cap sync android
          # Номер версии растёт с каждой сборкой, чтобы обновление ставилось поверх старой версии
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "::warning::Ключ подписи не задан — собираю отладочную версию. Добавьте секреты ANDROID_KEYSTORE_* (см. README)."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Подпись APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p out
          if [ -n "$KS_B64" ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            echo "$KS_B64" | base64 -d > release.jks
            $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --out out/patriki.apk aligned.apk
            $BT/apksigner verify out/patriki.apk
            rm -f release.jks
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/patriki.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: patriki-apk
          path: out/patriki.apk

  pages:
    needs: android
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: patriki-apk
          path: www/download

      - name: Библиотека Supabase внутрь сайта
        run: |
          npm install --no-audit --no-fund --no-save @supabase/supabase-js@2
          mkdir -p www/vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deploy
        uses: actions/deploy-pages@v4
